name: Apply Burrquizzz performance cleanup v0.8.1

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-performance-cleanup-v081.yml"
      - "scripts/apply-performance-cleanup-v081.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply performance-only cleanup
        run: node scripts/apply-performance-cleanup-v081.mjs

      - name: Remove one-time migration files
        run: |
          rm -f scripts/apply-performance-cleanup-v081.mjs
          rm -f .github/workflows/apply-performance-cleanup-v081.yml

      - name: Commit optimized release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Performance cleanup v0.8.1"
          git push
